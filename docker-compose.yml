name: ai-ops-copilot

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot}
      POSTGRES_DB: ${POSTGRES_DB:-copilot}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"  # localhost only: demo credentials
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-copilot} -d ${POSTGRES_DB:-copilot}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local development: the `dev` image target, source bind-mounted, auto-reload. The
  # production-shaped image is the default target: `docker build -t ops-copilot-api backend`.
  api:
    build:
      context: ./backend
      target: dev
    # Apply DB migrations on every start, then run the API.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-copilot}:${POSTGRES_PASSWORD:-copilot}@db:5432/${POSTGRES_DB:-copilot}
      UPLOAD_DIR: /uploads
      MODEL_CACHE_DIR: /models
      EVAL_RESULTS_DIR: /evals/results
      WARMUP_MODELS: "true"
      DEMO_AUTH: ${DEMO_AUTH:-true}  # X-User header stand-in for auth (demo only)
      # Optional: without a key the copilot runs in offline (extractive) mode.
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_EFFORT: ${LLM_EFFORT-medium}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-90}
      # Local models (Ollama): see .env.example.
      LLM_SCHEMA_WITH_TOOLS: ${LLM_SCHEMA_WITH_TOOLS:-true}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-}
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    volumes:
      - ./backend:/app
      - ./data:/data:ro
      - ./evals:/evals
      - uploads:/uploads
      - models:/models  # downloaded embedding/reranker models survive rebuilds
    depends_on:
      db:
        condition: service_healthy
    healthcheck:  # ready = migrations applied and models loaded
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 120s
      retries: 10

  web:
    build:
      context: ./frontend
      args:
        API_URL: http://api:8000  # baked into the Next.js /api rewrites at build time
    ports:
      - "127.0.0.1:${WEB_PORT:-3002}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  models:
