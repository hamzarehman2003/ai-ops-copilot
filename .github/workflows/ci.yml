name: CI

on:
  push:
    branches: [main, demo-prep]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, migrations, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: copilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U copilot -d copilot"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://copilot:copilot@localhost:5432/copilot
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations match the models
        run: |
          alembic upgrade head
          alembic check
      # Embedding + reranker models (~150 MB), downloaded on first use.
      - uses: actions/cache@v6
        with:
          path: backend/.cache/models
          key: models-${{ hashFiles('backend/app/ingestion/embeddings.py', 'backend/app/retrieval/*.py', 'backend/requirements.txt') }}
      - name: Tests (no LLM is ever called)
        run: pytest -q

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
        env:
          API_URL: http://localhost:8001
          NEXT_TELEMETRY_DISABLED: 1
      - name: Report build errors as annotations
        if: failure()
        run: tail -n 25 build.log | sed 's/^/::error title=next build::/'

  images:
    name: Docker images (production targets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Backend runtime image (non-root, no dev deps)
        run: |
          docker build -t ops-copilot-api backend
          test "$(docker run --rm --entrypoint id ops-copilot-api -u)" != "0"
      - name: Frontend image
        run: docker build -t ops-copilot-web frontend
